name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', 'tools/**', '.github/workflows/server.yml', 'README.md']
  pull_request:
    paths-ignore: ['server/**', 'tools/**', '.github/workflows/server.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The runner already has the SDK; this accepts its licences. The action's default package list still names
      # 'tools', which the SDK no longer ships, so ask for platform-tools only.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # The screenshots are how the design gets looked at on every change: every screen at phone size, with
      # real-looking data (app/src/test/.../ScreenshotTest.kt). They are uploaded as an artifact.
      # assembleRelease here is unsigned (no secrets on pull requests): it proves the release build and its lint pass
      # before main tries to sign one.
      - name: Build the APK and photograph every screen
        run: ./gradlew :app:assembleDebug :app:recordRoborazziDebug :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/

      # Releases only from main, signed with telly's own key (encrypted secrets; never on pull requests).
      - name: Build the signed release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TELLY_KEYSTORE_B64: ${{ secrets.TELLY_KEYSTORE_B64 }}
          TELLY_KEYSTORE_PASSWORD: ${{ secrets.TELLY_KEYSTORE_PASSWORD }}
          TELLY_KEY_ALIAS: ${{ secrets.TELLY_KEY_ALIAS }}
        run: |
          export TELLY_KEYSTORE="$RUNNER_TEMP/telly-release.jks"
          echo "$TELLY_KEYSTORE_B64" | base64 -d > "$TELLY_KEYSTORE"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          rm -f "$TELLY_KEYSTORE"
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/telly-$(git rev-parse --short HEAD).apk"
          echo "tag=build-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        id: meta

      - name: Publish the APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: telly ${{ steps.meta.outputs.tag }}
          body: |
            Release build of ${{ github.sha }}, signed with telly's own key.
          files: out/*.apk
          make_latest: true
