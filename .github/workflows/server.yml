name: Server

on:
  push:
    branches: ['**']
    tags: ['server-v*']
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Tests
        working-directory: server
        run: python -m unittest discover -s tests -v

  # Branch pushes get an image tagged sha-<commit> (for a branch deploy before merging); a server-vX.Y.Z tag gets
  # X.Y.Z. The image holds code only: the listener's catalogue lives on the server's own volume.
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            echo "tags=ghcr.io/${{ github.repository_owner }}/telly-server:${GITHUB_REF#refs/tags/server-v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${{ github.repository_owner }}/telly-server:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
